# One workflow for all npm publishing (npm's trusted publishing links to this single file).
# - Push to main: test, then publish a new version as "latest" (Personal + Tactus dashboard).
# - Daily schedule: the newest release that has been live 24 h is re-published as "stable" (Pelicargo dashboard).
# - Run workflow by hand with "promote" ticked: ship the newest release to "stable" right away.
name: Publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 16 * * *"   # daily, 8:17-9:17 AM Vancouver
  workflow_dispatch:
    inputs:
      promote:
        description: "Ship the newest release to stable (Pelicargo) now"
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
concurrency: publish
jobs:
  latest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - name: Set version
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Test
        run: npm test
      - name: Publish
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag release
        run: |
          git tag "v0.1.${{ github.run_number }}"
          git push origin "v0.1.${{ github.run_number }}"
      - name: Refresh CDN caches
        run: |
          sleep 30
          curl -fsS "https://purge.jsdelivr.net/npm/jt-workspace-dashboard@latest/dist/dashboard.js" || true

  stable:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pick the release
        id: pick
        run: |
          MIN_AGE=86400
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.promote }}" = "true" ]; then MIN_AGE=0; fi
          NOW=$(date +%s); PICK=""
          for t in $(git tag --list 'v*' --sort=-creatordate); do
            AGE=$(( NOW - $(git log -1 --format=%ct "$t") ))
            if [ "$AGE" -ge "$MIN_AGE" ]; then PICK="$t"; break; fi
          done
          echo "tag=$PICK" >> "$GITHUB_OUTPUT"
          echo "Picked: ${PICK:-none}"
      - if: steps.pick.outputs.tag != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pick.outputs.tag }}
      - if: steps.pick.outputs.tag != ''
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: steps.pick.outputs.tag != ''
        name: Publish as stable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          V="${{ steps.pick.outputs.tag }}"; V="${V#v}-stable"
          if npm view "jt-workspace-dashboard@$V" version >/dev/null 2>&1; then echo "Already stable: $V"; exit 0; fi
          npm install --no-audit --no-fund
          npm version "$V" --no-git-tag-version --allow-same-version
          npm test
          npm publish --access public --tag stable
          sleep 30
          curl -fsS "https://purge.jsdelivr.net/npm/jt-workspace-dashboard@stable/dist/dashboard.js" || true
